name: Feature request
description: Suggest an improvement for Item Lab
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for feature ideas, UX improvements, and compatibility requests for Item Lab.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change would you like?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add examples, mockups, or anything else that would help.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue or request first.
          required: true
